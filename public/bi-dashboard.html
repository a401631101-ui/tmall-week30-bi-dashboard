<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第30周天猫重点品类市场竞品看板 · 东方雨虹</title>
<script src="./vendor/echarts.min.js"></script>
<style>
:root{--red:#e02e3b;--r2:#c72530;--ink:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--bg:#f2f2f7;--white:#fff;--blue:#0071e3;--green:#007a5e;--amber:#e87c00;--purple:#894dde;--gold:#e8a400}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:200px 1fr;height:100vh}
.sidebar{background:#1d1d20;color:#ccc;display:flex;flex-direction:column;overflow-y:auto;padding:16px 0}
.side-logo{display:flex;align-items:center;gap:10px;padding:0 14px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.side-logo .logo{width:38px;height:38px;display:grid;place-items:center;background:var(--red);border-radius:10px;color:#fff;font-weight:900;font-size:14px;flex-shrink:0}
.side-logo strong{font-size:15px;color:#fff}.side-logo small{display:block;color:#888;font-size:10px;margin-top:2px}
.side-label{padding:14px 14px 6px;color:#6e6e73;font-size:10px;font-weight:800;letter-spacing:.06em}
.side-btn,.side-cat{display:flex;align-items:center;gap:8px;width:calc(100% - 10px);margin:1px 5px;padding:9px 10px;border:0;background:transparent;color:#aaa;border-radius:6px;cursor:pointer;font-size:13px;text-align:left}
.side-btn:hover,.side-cat:hover{background:rgba(255,255,255,.04);color:#eee}
.side-btn.active{background:var(--red);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(224,46,59,.3)}
.side-btn i{font-style:normal;width:18px;text-align:center;font-size:12px}
.side-cats{flex:1;overflow-y:auto;padding:4px 0}
.side-cat{font-size:12px;padding:7px 10px}.side-cat .n{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;background:rgba(255,255,255,.05);border-radius:5px;font-size:10px;color:#888;flex-shrink:0}
.side-cat:hover .n{background:var(--red);color:#fff}.side-cat.active{background:rgba(224,46,59,.12);color:#fff}.side-cat.active .n{background:var(--red);color:#fff}
.side-foot{padding:12px 14px 0;border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:#777}.side-foot strong{display:block;color:#ccc;font-size:12px;margin:3px 0}

.main{overflow-y:auto;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--white);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.topbar h1{font-size:22px;font-weight:900;letter-spacing:-.02em}.topbar h1 span{color:var(--red)}
.topbar .period{color:var(--muted);font-size:12px}
.content{padding:14px 18px 24px}.tab-panel{display:none}.tab-panel.active{display:block}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.kpi-card{position:relative;padding:16px 16px;background:var(--white);border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.05);overflow:hidden;transition:.15s}
.kpi-card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.kpi-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px}
.kpi-card:nth-child(1)::before{background:var(--blue)}.kpi-card:nth-child(2)::before{background:var(--red)}.kpi-card:nth-child(3)::before{background:var(--green)}.kpi-card:nth-child(4)::before{background:var(--purple)}.kpi-card:nth-child(5)::before{background:var(--amber)}
.kpi-card .kl{font-size:12px;color:var(--muted);font-weight:700}.kpi-card .kv{font-size:28px;font-weight:900;margin:5px 0 2px;letter-spacing:-.02em}.kpi-card .ks{font-size:11px;color:var(--muted)}

/* Grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:10px}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:10px}

.card{background:var(--white);border-radius:10px;padding:16px 18px;box-shadow:0 1px 6px rgba(0,0,0,.05);margin-bottom:10px}
.card h3{font-size:16px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.card h3 .tag{font-size:11px;font-weight:500;color:var(--muted);background:#f0f0f5;padding:3px 8px;border-radius:8px}
.chart-box{width:100%}.h300{height:300px}.h350{height:350px}

/* Product image cards */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pgrid.pg5{grid-template-columns:repeat(5,1fr)}
.pgrid.pg3{grid-template-columns:repeat(3,1fr)}
.pcard{background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .18s;text-decoration:none;color:inherit;display:block}
.pcard:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,0,0,.1);border-color:#bbb}
.pcard.yuhong{border:2px solid var(--red);background:#fff5f5}
.pcard.hot{border:2px solid #e8a400;background:linear-gradient(135deg,#fffdf5,#fff9e8)}
.pcard.yuhong.hot{border:2px solid var(--red);background:linear-gradient(135deg,#fff5f5,#ffe8e8)}
.pimg{position:relative;height:150px;background:#f5f5f7;display:grid;place-items:center;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:contain}
.pimg .noimg{display:flex;flex-direction:column;align-items:center;gap:4px;color:#bbb;font-size:12px}.pimg .noimg span{font-size:30px;opacity:.5}
.prank{position:absolute;top:6px;left:6px;width:26px;height:26px;display:grid;place-items:center;background:var(--red);color:#fff;border-radius:6px 12px 6px 12px;font-size:11px;font-weight:900;box-shadow:0 2px 8px rgba(224,46,59,.4)}
.prank.t3{background:var(--gold);box-shadow:0 2px 8px rgba(232,164,0,.4)}
.pstatus{position:absolute;top:7px;right:6px;padding:3px 7px;border-radius:8px;font-size:10px;font-weight:700}
.ps-good{color:var(--green);background:#e6f5f0}.ps-warn{color:var(--amber);background:#fff4e6}.ps-risk{color:var(--red);background:#ffeaea}
.pbody{padding:10px 12px}.pbody .pb{font-size:13px;font-weight:900;display:flex;align-items:center;gap:4px;letter-spacing:-.01em}
.pbody .pb .yhtag{font-size:11px;background:var(--red);color:#fff;padding:2px 5px;border-radius:4px;font-weight:700}
.pbody .pn{font-size:12px;color:var(--muted);line-height:1.45;margin:3px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.pbody .pt{font-size:12px;font-weight:800;font-family:SF Mono,Menlo,monospace;color:var(--blue);margin:4px 0}
.pbody .pm{display:flex;gap:10px;font-size:11px;color:var(--muted)}.pbody .pm strong{color:var(--ink);font-size:12px}
.pfoot{display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.pfoot a{color:var(--red);text-decoration:none;font-weight:800}
/* Product tags */
.ptags{display:flex;gap:5px;margin:4px 0}.ptag-cat{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:#e8f0fe;color:#0071e3}.ptag-dir{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:#fef0e6;color:#e87c00}

/* Brand bars */
.bbar{display:grid;grid-template-columns:22px 90px 1fr 30px;align-items:center;gap:8px;padding:5px 6px;border-radius:5px;font-size:13px}
.bbar:nth-child(odd){background:#f9f9fb}.bbar.yh{background:#fff0f0;outline:1px solid #ffcccc}
.bbar b{color:#999;font-size:11px;font-weight:800}.bbar strong{font-size:13px;font-weight:800}
.bbar i{height:10px;background:#e8e8ed;border-radius:5px;overflow:hidden}.bbar i em{display:block;height:100%;border-radius:inherit}
.bbar:nth-child(1) i em{background:linear-gradient(90deg,#5ea8ff,var(--blue))}
.bbar:nth-child(2) i em{background:linear-gradient(90deg,#40b894,var(--green))}
.bbar:nth-child(3) i em{background:linear-gradient(90deg,#b095e8,var(--purple))}
.bbar:nth-child(4) i em{background:linear-gradient(90deg,#ffb84d,var(--amber))}
.bbar:nth-child(5) i em{background:linear-gradient(90deg,#ff5e6b,var(--red))}
.bbar.yh i em{background:linear-gradient(90deg,#ff5e6b,var(--red))!important}
.bbar em{font-style:normal;font-weight:800;text-align:right;font-size:13px}
.yhbadge{font-size:11px;background:var(--red);color:#fff;padding:2px 5px;border-radius:4px;margin-left:4px;font-weight:700}

/* Anomaly items */
.aitem{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:5px;background:#f9f9fb;font-size:13px;text-decoration:none;color:inherit;cursor:pointer}
.aitem:hover{background:#f2f2f7}.aitem.up{border-left:3px solid var(--green)}.aitem.down{border-left:3px solid var(--red)}
.aitem .ad{font-weight:900;font-size:14px}.aitem .ad.up{color:var(--green)}.aitem .ad.down{color:var(--red)}
.aitem strong{display:block;font-size:13px;font-weight:800}.aitem small{display:block;color:var(--muted);font-size:11px;margin-top:2px}

/* Anomaly grid in category */
.ano-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ano-block{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}.ano-block h4{font-size:11px;font-weight:800;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.ano-block h4.up{color:var(--green)}.ano-block h4.down{color:var(--red)}
.ano-row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:6px;padding:4px 0;font-size:11px;border-bottom:1px solid #f5f5f7;text-decoration:none;color:inherit;cursor:pointer}
.ano-row:last-child{border-bottom:0}.ano-row:hover{background:#fafafa}
.ano-row b{color:var(--muted);font-size:11px}.ano-row .an{font-size:12px;font-weight:700}.ano-row .at{color:var(--muted);font-size:11px}.ano-row .adelta{font-weight:900;font-size:12px}.ano-row .adelta.u{color:var(--green)}.ano-row .adelta.d{color:var(--red)}

/* Tables */
.scroll-table{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 180px)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f5f5f7;font-weight:800;font-size:12px;padding:9px 10px;text-align:left;border-bottom:2px solid #ddd;position:sticky;top:0;z-index:2;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #eee}tbody tr:hover{background:#fafafa}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700}
.bp{color:var(--green);background:#e6f5f0}.bd{color:var(--red);background:#ffeaea}.bw{color:var(--amber);background:#fff4e6}.bn{color:var(--muted);background:#f0f0f5}

/* Controls */
.cbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 0 12px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.cbar label{font-size:13px;font-weight:800;color:var(--ink)}.cbar span{color:var(--muted);font-size:13px}
select,input[type=text]{background:var(--white);border:1px solid #d5d5dd;border-radius:6px;padding:7px 10px;font-size:13px;outline:none}select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.1)}

/* Segment cards */
.seg-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg-card{padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--white)}
.seg-card:nth-child(1){border-top:3px solid var(--red)}.seg-card:nth-child(2){border-top:3px solid var(--blue)}.seg-card:nth-child(3){border-top:3px solid var(--green)}.seg-card:nth-child(4){border-top:3px solid var(--amber)}
.seg-card .sk{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}.seg-card .sv{font-size:22px;font-weight:900;letter-spacing:-.02em}.seg-card .st{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}

/* Segment keywords */
.seg-keywords{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.seg-kw{padding:14px;border-radius:10px;background:var(--white);border:1px solid var(--line)}.seg-kw:nth-child(1){border-left:3px solid var(--red)}.seg-kw:nth-child(2){border-left:3px solid var(--blue)}.seg-kw:nth-child(3){border-left:3px solid var(--green)}.seg-kw:nth-child(4){border-left:3px solid var(--amber)}.seg-kw:nth-child(5){border-left:3px solid var(--purple)}
.seg-kw .kw{font-size:19px;font-weight:900;margin:3px 0;letter-spacing:-.01em}.seg-kw .km{font-size:12px;color:var(--muted)}.seg-kw .kt{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}

/* Action cards - color filled */
.act-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.act-card{padding:18px 20px;border-radius:10px;color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.act-card:nth-child(1){background:linear-gradient(135deg,#007a5e,#00a67d)}
.act-card:nth-child(2){background:linear-gradient(135deg,#0071e3,#3395ff)}
.act-card:nth-child(3){background:linear-gradient(135deg,#c72530,#e02e3b)}
.act-card h4{font-size:15px;font-weight:900;margin-bottom:8px;letter-spacing:-.01em}
.act-card p{color:rgba(255,255,255,.85);line-height:1.6;font-size:12px}
.act-card .ah{font-size:14px;font-weight:900;margin:8px 0 0;opacity:.9}

/* Segment bubbles */
.seg-bubbles{display:flex;flex-wrap:wrap;gap:8px}
.seg-bubble{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:800;border:2px solid var(--line);background:var(--white);transition:.15s}
.seg-bubble:hover{transform:scale(1.04);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.seg-bubble .sb-num{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:14px;font-weight:900;color:#fff;background:var(--blue)}
.seg-bubble:nth-child(2n) .sb-num{background:var(--green)}
.seg-bubble:nth-child(3n) .sb-num{background:var(--purple)}
.seg-bubble:nth-child(4n) .sb-num{background:var(--amber)}
.seg-bubble:nth-child(5n) .sb-num{background:var(--red)}
.seg-bubble .sb-name{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg-popup{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:100;justify-content:center;align-items:center}
.seg-popup.show{display:flex}.seg-popup>div{background:var(--white);border-radius:12px;padding:24px;max-width:420px;width:90%;box-shadow:0 12px 40px rgba(0,0,0,.15)}
.seg-popup h3{font-size:18px;margin-bottom:12px}.seg-popup p{font-size:14px;line-height:1.8;color:var(--ink)}
.seg-popup button{margin-top:14px;padding:8px 20px;border:0;background:var(--red);color:#fff;border-radius:6px;cursor:pointer;font-size:14px;font-weight:700}
/* Brand top3 expand */
.brand-top3-row{cursor:pointer;padding:6px 8px;border-radius:6px;transition:.15s}
.brand-top3-row:hover{background:#f5f5fa}
.brand-top3-detail{display:none;padding:6px 12px;margin:2px 0 8px 30px;background:#f8f8fc;border-radius:6px;font-size:11px;line-height:1.6}
.brand-top3-detail.open{display:block}
.brand-top3-detail b{color:var(--blue)}
/* Compact yuhong card */
.yh-compact{padding:12px;background:#fff8f8;border:1px solid #ffd5d5;border-radius:8px}.yh-compact h4{font-size:13px;color:var(--red);margin-bottom:4px}.yh-compact p{font-size:11px;line-height:1.55;color:#555;margin:2px 0}
/* Anomaly scroll */
.ano-scroll{max-height:420px;overflow-y:auto;padding-right:4px}
.ano-scroll::-webkit-scrollbar{width:4px}.ano-scroll::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px}
/* Bigger product tags */
.ptag-cat{font-size:11px!important;font-weight:800!important;padding:3px 8px!important}.ptag-dir{font-size:11px!important;font-weight:800!important;padding:3px 8px!important}

footer{text-align:center;padding:10px;color:var(--muted);font-size:10px;border-top:1px solid var(--line);background:var(--white)}

@media(max-width:1200px){.g2,.g21{grid-template-columns:1fr}.pgrid{grid-template-columns:repeat(3,1fr)}.kpi-row{grid-template-columns:repeat(3,1fr)}}
.mobile-menu{display:none;border:0;background:var(--red);color:#fff;border-radius:7px;padding:8px 11px;font-size:14px;font-weight:800;cursor:pointer}
@media(max-width:800px){
  .app{grid-template-columns:1fr}.pgrid{grid-template-columns:repeat(2,1fr)}.ano-grid{grid-template-columns:1fr}
  .mobile-menu{display:inline-flex}.sidebar{display:flex;position:fixed;inset:0 auto 0 0;width:min(82vw,300px);z-index:100;transform:translateX(-105%);transition:transform .2s;box-shadow:10px 0 30px rgba(0,0,0,.25)}
  .sidebar.mobile-open{transform:translateX(0)}.topbar{padding:10px 12px;gap:10px;justify-content:flex-start}.topbar h1{font-size:17px}.topbar .period{display:none}.content{padding:10px}
}

/* CSS Donut Chart */
.donut-chart{position:relative;width:220px;height:220px;margin:0 auto}
.donut-chart svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut-chart .center-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.donut-chart .center-text b{display:block;font-size:28px;color:var(--ink);line-height:1.1}
.donut-chart .center-text span{display:block;font-size:14px;font-weight:700;color:var(--muted)}
.donut-legend{display:flex;flex-wrap:wrap;gap:3px 10px;justify-content:center;margin-top:8px;font-size:11px}
.donut-legend span{display:flex;align-items:center;gap:4px}
.donut-legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.donut-legend b{color:var(--ink)}
</style>
</head>
<body>

<div class="app">
<aside class="sidebar" id="sidebar" aria-label="看板导航">
  <div class="side-logo"><div class="logo">虹</div><span><strong>东方雨虹·看板</strong><small>W30 · 市场洞察</small></span></div>
  <div class="side-label">品牌驾驶舱</div>
  <button class="side-btn active" id="nav-overview" onclick="switchTab('overview')"><i>◉</i>经营总览</button>
  <button class="side-btn" id="nav-brands" onclick="switchTab('brands')"><i>▣</i>品牌矩阵</button>
  <button class="side-btn" id="nav-brandsort" onclick="switchTab('brandsort')"><i>📊</i>品牌周对比</button>
  <button class="side-btn" id="nav-products" onclick="switchTab('products')"><i>🎯</i>Top10产品</button>
  <button class="side-btn" id="nav-anomalies" onclick="switchTab('anomalies')"><i>⚡</i>异动信号</button>
  <div class="side-label">品类分析</div>
  <div class="side-cats" id="sideCats"></div>
  <button class="side-btn" id="nav-data" onclick="switchTab('data')"><i>⊡</i>数据查询</button>
  <div class="side-foot"><span>报告周期</span><strong>07.20 — 07.26</strong><small>天猫+淘宝 · 三周对比</small></div>
</aside>

<div class="main">
<header class="topbar">
  <button class="mobile-menu" id="mobileMenu" type="button" aria-controls="sidebar" aria-expanded="false">☰ 导航</button>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <h1><span>东方雨虹</span> · 天猫重点品类市场竞品看板</h1>
    <label for="headerCatFilter" style="font-weight:800;font-size:13px">类目</label>
    <select id="headerCatFilter" onchange="renderTopBrandTags()" style="min-width:130px"><option value="全部">全品类</option></select>
    <div id="topBrandTags" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"></div>
  </div>
  <span class="period">第30周 · 2026.07.20 — 07.26 · 第28周→第29周→第30周</span>
</header>
<div class="content">

<!-- OVERVIEW -->
<div class="tab-panel active" id="tab-overview">
  <div class="kpi-row" id="yuhongKpis"><div class="kpi-card"><div class="kl">加载中...</div><div class="kv">—</div></div></div>
  <div class="act-cards" id="actionCards"></div>
  <div class="g21">
    <div class="card"><h3>雨虹品牌 · 品类版图<span class="tag">各品类入榜商品趋势</span></h3><div class="chart-box h350" id="cYuhongMap"></div></div>

// ── DATA LOADING ──
function initData(cb){if(_dashboardData){if(cb)cb(_dashboardData);return Promise.resolve(_dashboardData)}
  if(!_dataPromise)_dataPromise=Promise.all([LJ('./data/01.json'),LJ('./data/02.json'),LJ('./data/03.json'),Promise.all(CATS.map(function(c){return LJ('./data/'+F[c]+'.json')})),LJ('./product-images.json').catch(function(){return{}})]).then(function(r){
    _images=r[4]||{};

    var products=r[1].values.slice(2).filter(function(x){return x[0]&&x[0]!=='品类'});
    var anomalies=r[2].values.slice(2).filter(function(x){return x[0]&&x[0]!=='异动类型'});
    var allCat={};
    CATS.forEach(function(c,i){
      var rows=r[3][i].values,summary={},catBrands=[],catProds=[],catSegs=[],catAnos={upTwo:[],downTwo:[],upJump:[],downDrop:[],newIn:[],exit:[]},sec=null,sawSegH=false,azSec=null;
      for(var j=0;j<rows.length;j++){var row=rows[j];if(!row)continue;var a=String(row[0]||'');
        // Section detection
        if(a.includes('一、')){sec='s';continue}if(a.includes('二、')){sec='b';continue}if(a.includes('三、')){sec='p';continue}if(a.includes('四、')){sec='az';azSec=null;continue}if(a.includes('五、')){sec='seg';sawSegH=false;continue}
        // Summary
        if(sec==='s'&&row[1]){if(a==='类目格局')summary.pattern=row[1];else if(a==='品牌矩阵判断')summary.matrix=row[1];else if(a==='单品绝对实力')summary.product=row[1];else if(a==='风险提示')summary.risk=row[1];else if(a==='下周观察')summary.next=row[1]}
        // Brands
        if(sec==='b'&&row[1]&&a!=='品类')catBrands.push({name:row[1],top10:row[2]||'',top30:row[3]||'',top100:row[4]||'',tag:row[5]||'',judgment:row[6]||''})
        // Products
        if(sec==='p'&&row[2]&&a!=='本周排名')catProds.push({rank:Number(row[0])||0,brand:row[2]||'',id:row[3]||'',name:row[4]||'',track:row[5]||'',status:row[6]||'',judgment:row[7]||'',direction:row[8]||'',popularity:row[9]||'',conversion:row[10]||''})
        // Anomaly zones (section 四)
        if(sec==='az'){
          if(a.includes('连续两周上升')&&!a.includes('下降')){azSec='upTwo';continue}
          if(a.includes('单周上升超过20名')){azSec='upJump';continue}
          if(a.includes('新进前100')){azSec='newIn';continue}
          if(azSec&&a&&!a.includes('关键词')&&!a.includes('商品名称')&&row[1]){
            var l={name:row[0]||'',brand:row[1]||'',id:row[2]||'',track:row[3]||'',rank:String(row[4]||''),delta:String(row[5]||''),pop:row[6]||'',conv:row[7]||'',action:row[8]||'',judgment:row[9]||''};
            var rn=row[11]?String(row[11]||''):'',rb=row[12]?String(row[12]||''):'';
            var ri={name:rn,brand:rb,id:row[13]||'',track:row[14]||'',rank:String(row[15]||''),delta:String(row[16]||''),pop:row[17]||'',conv:row[18]||'',action:row[19]||'',judgment:row[20]||''};
            if(azSec==='upTwo'){if(l.brand)catAnos.upTwo.push(l);if(ri.brand)catAnos.downTwo.push(ri)}
            else if(azSec==='upJump'){if(l.brand)catAnos.upJump.push(l);if(ri.brand)catAnos.downDrop.push(ri)}
            else if(azSec==='newIn'){if(l.brand)catAnos.newIn.push(l);if(ri.brand)catAnos.exit.push(ri)}
          }
        }

      }
      allCat[c]={summary:summary,brands:catBrands,products:catProds,segments:catSegs,anos:catAnos};
    });
    _dashboardData={brands:brands,products:products,anomalies:anomalies,allCat:allCat};
    return _dashboardData;
  }).catch(function(e){_dataPromise=null;showLoadError(e);throw e});

// CSS Donut Chart generator with clickable segments
function donutHTML(data,label){
  var colors=['#e02e3b','#0071e3','#0f9f6e','#ef9b24','#894dde','#bbb'];
  var total=data.reduce(function(s,d){return s+d.value},0)||1;
  var r=65,cx=100,cy=100,sw=28,circ=Math.round(2*Math.PI*r);
  var offset=0,svgParts=[],legendParts=[],uid='donut_'+Math.random().toString(36).slice(2,8);
  data.filter(function(d){return d.value>0}).forEach(function(d,i){
    var pct=d.value/total;
    var dash=Math.round(pct*circ);
    var c=colors[i%6];
    var n=d.name,v=d.value,pt=Math.round(pct*100);
    svgParts.push('<circle r="'+r+'" cx="'+cx+'" cy="'+cy+'" fill="none" stroke="'+c+'" stroke-width="'+sw+'" stroke-dasharray="'+dash+' '+(circ-dash)+'" stroke-dashoffset="'+(-offset)+'" class="donut-seg" data-name="'+escA(n)+'" data-value="'+v+'" data-pct="'+pt+'" data-color="'+c+'" onclick="var t=document.getElementById(\''+uid+'\').querySelector(\'.donut-tip\');t.innerHTML=\'<b style=color:'+c+'>●</b> '+escA(n)+' <b>'+v+'席('+pt+'%)</b>\';t.style.display=\'block\';setTimeout(function(){t.style.display=\'none\'},1800);event.stopPropagation()" style="cursor:pointer"/>');
    offset+=dash;
    legendParts.push('<span role="button" tabindex="0" onclick="var t=document.getElementById(\''+uid+'\').querySelector(\'.donut-tip\');t.innerHTML=\'<b style=color:'+c+'>●</b> '+escA(n)+' <b>'+v+'席('+pt+'%)</b>\';t.style.display=\'block\';setTimeout(function(){t.style.display=\'none\'},1800);event.stopPropagation()" style="cursor:pointer"><i style="background:'+c+'"></i>'+esc(n)+' <b>'+v+'席('+pt+'%)</b></span>');
  });
  return '<div class="donut-chart" id="'+uid+'"><svg viewBox="0 0 200 200">'+svgParts.join('')+'</svg><div class="center-text" style="pointer-events:none"><b>'+total+'</b><span>'+label+'</span></div><div class="donut-tip" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap;z-index:20;pointer-events:none"></div></div><div class="donut-legend">'+legendParts.join('')+'</div>';
}

  CATS.forEach(function(c){var ps=(D.allCat[c]?.products||[]).slice().sort(function(a,b){return a.rank-b.rank}).slice(0,10);total+=ps.length;ps.forEach(function(p){p.category=c});h+='<div class="card"><h3>'+esc(c)+'<span class="tag">'+ps.length+'个Top10商品</span></h3><div class="pgrid pg5">'+ps.map(function(p){return pCard(p)}).join('')+'</div></div>'});
  el.innerHTML=h.replace('15品类 × 每类10个','共 '+total+' 个头部商品');
})}

var _brandSort='top100';
function brandSortButton(key,label){var active=_brandSort===key;return'<button type="button" onclick="_brandSort=\''+key+'\';renderBrandSort()" style="padding:6px 12px;border:1px solid '+(active?'var(--red)':'var(--line)')+';border-radius:7px;background:'+(active?'#fff5f5':'#fff')+';color:'+(active?'var(--red)':'var(--ink)')+';cursor:pointer;font-size:13px;font-weight:800">'+label+(active?' ▼':'')+'</button>'}
function changeArrow(cur,prev){if(cur>prev)return'<span style="color:var(--green);font-size:14px;font-weight:900">↑'+(cur-prev)+'</span>';if(cur<prev)return'<span style="color:var(--red);font-size:14px;font-weight:900">↓'+(prev-cur)+'</span>';return'<span style="color:var(--muted);font-size:14px;font-weight:900">—</span>'}
function renderBrandSort(){initData(function(D){
  var sorted=D.brands.slice().sort(function(a,b){
    if(_brandSort==='cats')return(Number(b[1])||0)-(Number(a[1])||0);
    if(_brandSort==='w3t10')return lastV(b[2])-lastV(a[2]);
    if(_brandSort==='w3t30')return lastV(b[3])-lastV(a[3]);
    if(_brandSort==='top10')return lastV(b[2])-lastV(a[2]);
    if(_brandSort==='top30')return lastV(b[3])-lastV(a[3]);
    return lastV(b[4])-lastV(a[4])
  });
  var h='<div class="card"><h3>📊 品牌周对比<span class="tag">第28周 → 第29周 → 第30周</span></h3><div class="cbar"><label>排序</label>'+brandSortButton('top100','Top100')+brandSortButton('top30','Top30')+brandSortButton('top10','Top10')+brandSortButton('cats','品类数')+brandSortButton('w3t10','第30周T10')+brandSortButton('w3t30','第30周T30')+'<span>'+sorted.length+'个品牌</span></div><div class="scroll-table" style="max-height:calc(100vh - 230px)"><table><thead><tr><th rowspan="2">#</th><th rowspan="2">品牌</th><th rowspan="2">品类数</th><th colspan="3" style="text-align:center;background:#e8f0fe">第28周</th><th colspan="3" style="text-align:center;background:#e6f5f0">第29周</th><th colspan="3" style="text-align:center;background:#fef0e6">第30周</th><th rowspan="2">判断</th></tr><tr><th>T10</th><th>T30</th><th>T100</th><th>T10</th><th>T30</th><th>T100</th><th>T10</th><th>T30</th><th>T100</th></tr></thead><tbody>';
  sorted.slice(0,100).forEach(function(r,i){var a=vals(r[2]),b=vals(r[3]),c=vals(r[4]),isYh=r[0]==='东方雨虹',w=function(v,n){return v[n]||0};h+='<tr'+(isYh?' style="background:#fff1f1"':'')+'><td>'+(i+1)+'</td><td><strong style="font-size:14px">'+esc(r[0])+'</strong>'+(isYh?'<span class="yhbadge">虹</span>':'')+'</td><td><b>'+esc(r[1]||0)+'</b></td><td>'+w(a,0)+'</td><td>'+w(b,0)+'</td><td>'+w(c,0)+'</td><td>'+w(a,1)+' '+changeArrow(w(a,1),w(a,0))+'</td><td>'+w(b,1)+' '+changeArrow(w(b,1),w(b,0))+'</td><td>'+w(c,1)+' '+changeArrow(w(c,1),w(c,0))+'</td><td>'+w(a,2)+' '+changeArrow(w(a,2),w(a,1))+'</td><td>'+w(b,2)+' '+changeArrow(w(b,2),w(b,1))+'</td><td>'+w(c,2)+' '+changeArrow(w(c,2),w(c,1))+'</td><td><span class="badge '+getT(r[6])+'">'+esc(r[6]||'')+'</span></td></tr>'});
  document.getElementById('brandSortContent').innerHTML=h+'</tbody></table></div></div>';
})}

function loadManifest(){
  if(_manifest)return Promise.resolve(_manifest);
  if(!_manifestPromise)_manifestPromise=LJ('./data/manifest.json').then(function(m){_manifest=m;return m}).catch(function(e){_manifestPromise=null;throw e});
  return _manifestPromise;
}
function loadSheet(file){
  if(_sheetCache[file])return Promise.resolve(_sheetCache[file]);
  if(!_sheetPromises[file])_sheetPromises[file]=LJ(file).then(function(j){_sheetCache[file]=j;delete _sheetPromises[file];return j}).catch(function(e){delete _sheetPromises[file];throw e});
  return _sheetPromises[file];
}
function scheduleRenderData(){clearTimeout(_dataSearchTimer);_dataSearchTimer=setTimeout(renderData,250)}
function renderData(){var sel=document.getElementById('dataSheet'),el=document.getElementById('dataTable');
  if(!_manifest){loadManifest().then(function(m){sel.innerHTML=m.map(function(it,i){return'<option value="'+i+'">'+(i+1).toString().padStart(2,'0')+'. '+esc(it.sheet)+'</option>'}).join('');renderData()}).catch(showLoadError);return}
  var idx=parseInt(sel.value)||0,item=_manifest[idx];if(!item)return;var q=(document.getElementById('dataSearch')?.value||'').toLowerCase();
  el.innerHTML='<div style="text-align:center;padding:60px;color:var(--muted)">加载中...</div>';
  var dataFile=item.file&&item.file.charAt(0)==='/'?'.'+item.file:item.file;
  loadSheet(dataFile).then(function(j){var rows=j.values,cols=j.cols,f=q?rows.filter(function(r){return r.some(function(c){return String(c||'').toLowerCase().includes(q)})}):rows,shown=f.slice(0,500);
    document.getElementById('dataInfo').textContent=item.sheet+' · 共'+item.rows.toLocaleString()+'行 · 匹配'+f.length.toLocaleString()+'行 · 当前显示'+shown.length+'行';
    el.innerHTML='<table style="width:max-content;min-width:100%"><thead><tr><th style="min-width:40px;text-align:center">#</th>'+Array.from({length:cols},function(_,i){var n=i+1,l='';while(n>0){n--;l=String.fromCharCode(65+(n%26))+l;n=Math.floor(n/26)}return'<th>'+l+'</th>'}).join('')+'</tr></thead><tbody>'+shown.map(function(r,ri){return'<tr><td style="color:var(--muted);text-align:center;font-size:11px">'+(ri+1)+'</td>'+r.map(function(c){var v=c===null||c===undefined?'':String(c);return'<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis" title="'+escA(v)+'">'+esc(v.slice(0,65))+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'}).catch(showLoadError)}

enhanceAccessibility();
initData(function(){renderOverview();renderTopBrandTags()});
</script>
